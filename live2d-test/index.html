<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Live2D 動作テスト - 桃瀬ひより (v8)</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; overflow: hidden; }
  #canvas { display: block; margin: 0 auto; border: 1px solid red; }
  #info {
    position: fixed; top: 8px; left: 8px; color: #0f0;
    font-family: monospace; font-size: 12px; z-index: 10;
    background: rgba(0,0,0,0.5); padding: 4px 8px; max-width: 90vw;
  }
</style>
</head>
<body>
<div id="info">読み込み中...</div>
<canvas id="canvas" width="800" height="900"></canvas>

<!-- PixiJS v8本体（PixiJS公式が案内しているCDN） -->
<script src="https://pixijs.download/release/pixi.min.js"></script>
<!-- Cubism 3/4系モデル用ランタイム（Cubism Core）
     ※ CDN直リンクは公式に「不安定なので使うな」とされているため、
     Cubism SDK for Web からCoreフォルダのファイルを取り出し、
     このindex.htmlと同じ階層に置いてローカル参照する -->
<script src="./live2dcubismcore.min.js"></script>
<!-- pixi-live2d-display本体（Cubism4専用ビルド）
     ※ 本家 guansss/pixi-live2d-display は2023年頃で更新停止しており、
     新しいCubism Coreとの間で "Cannot read properties of undefined" エラーが
     出ることが確認されている（GitHub Issue #177等）。
     現在もメンテナンスが続いているフォーク（PixiJS v8対応）に切り替える。 -->
<script src="https://cdn.jsdelivr.net/npm/@jannchie/pixi-live2d-display/dist/cubism4.min.js"></script>

<script>
(async () => {
  const info = document.getElementById("info");
  try {
    if (typeof window.Live2DCubismCore === "undefined") {
      throw new Error("live2dcubismcore.min.js が読み込めていません（ファイルの配置場所を確認してください）");
    }
    if (typeof PIXI === "undefined") {
      throw new Error("pixi.min.js が読み込めていません（ネット接続を確認してください）");
    }
    if (typeof PIXI.live2d === "undefined") {
      throw new Error("cubism4.min.js（pixi-live2d-display フォーク）が読み込めていません（ネット接続を確認してください）");
    }

    if (typeof PIXI.live2d.Live2DModel.registerTicker === "function") {
      PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
    }

    // PixiJS v8はApplication生成の作法が変わり、init()を別途awaitする必要がある
    const app = new PIXI.Application();
    await app.init({
      canvas: document.getElementById("canvas"),
      width: 800,
      height: 900,
      backgroundAlpha: 0,
    });

    const model = await PIXI.live2d.Live2DModel.from("runtime/hiyori_free_t08.model3.json");

    app.stage.addChild(model);

    console.log("model.width/height:", model.width, model.height);

    model.anchor.set(0.5, 0.5);
    model.position.set(app.renderer.width / 2, app.renderer.height / 2);

    let scale = 0.15;
    if (model.width > 0 && model.height > 0) {
      scale = Math.min(
        (app.renderer.width * 0.85) / model.width,
        (app.renderer.height * 0.85) / model.height
      );
    }
    model.scale.set(scale);

    info.textContent = `[v8] 読み込み成功 (scale=${scale.toFixed(3)}, w=${model.width}, h=${model.height}) / タップでモーション再生`;

    window.__app = app;
    window.__model = model;

    model.on("hit", (hitAreas) => {
      if (hitAreas.includes("Body")) {
        model.motion("Tap@Body");
      }
    });
  } catch (err) {
    info.textContent = "読み込み失敗: " + err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
